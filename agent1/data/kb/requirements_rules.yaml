clarification_templates:
  missing_gpu_vram: "Указан графический ускоритель, но объём видеопамяти (VRAM) равен 0 ГБ. Уточните объём VRAM или подтвердите запуск только на CPU."
  missing_hardware_mode: "Не указана видеокарта и не подтверждён допустимый запуск на CPU. Укажите модель и объём VRAM GPU либо разрешите CPU-режим."
  short_description: "Описание прикладной задачи слишком краткое. Уточните предметную область (домен), язык документов и требования к приватности."
  vram_mismatch_warning: "Объём VRAM ({actual} ГБ) отличается от спецификации {gpu} ({expected} ГБ)."
  low_vram_warning: "Объём VRAM ({actual} ГБ) ниже рекомендуемого минимума ({min_vram} ГБ) для локального контура RAG."
